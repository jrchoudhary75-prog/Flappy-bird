<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Ultimate Skins Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h2 {
            margin: 5px;
            color: #9ef01a;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        canvas {
            border: 6px solid #113822;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            background: #1b4332;
        }
        .instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #b7e4c7;
            text-align: center;
        }
    </style>
    <script src="skins.js"></script>

    <!-- Firebase SDK Modular CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYTo_Flsgdj_3ktQ3FB704xgbTSppLpt0",
            authDomain: "chess-arena-eb263.firebaseapp.com",
            projectId: "chess-arena-eb263",
            storageBucket: "chess-arena-eb263.appspot.com",
            messagingSenderId: "735495318337",
            appId: "1:735495318337:web:c058d5829d8fdbd9448fc0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.realGoogleLogin = function() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    window.userEmail = user.email;
                    localStorage.setItem("flappyUserEmail", window.userEmail);
                    if (typeof saveGameProgress === "function") {
                        saveGameProgress();
                    }
                    window.gameState = "MENU";
                })
                .catch((error) => {
                    console.warn("Google Sign-In restricted on local file. Switching to Guest mode.");
                    // Fallback to Guest if local file blocks popup
                    window.userEmail = "guest_player@local";
                    localStorage.setItem("flappyUserEmail", window.userEmail);
                    window.gameState = "MENU";
                });
        };
    </script>
</head>
<body>

    <h2>Flappy Bird - Ultimate Edition</h2>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div class="instructions">
        Click or Spacebar to play! (Make sure 'coin.png', 'setting.png' and 'skins.js' are in the same folder)
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "LOGIN"; 
        let score = 0;
        let highScore = localStorage.getItem("flappyHighScore") || 0;
        let coins = parseInt(localStorage.getItem("flappyCoins")) || 150;
        let userEmail = localStorage.getItem("flappyUserEmail") || "";

        window.gameState = gameState;
        window.userEmail = userEmail;

        let settings = {
            music: true,
            sound: true,
            vibration: true
        };

        let audioCtx = null;
        let musicTimer = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!settings.sound) return;
            initAudio();
            if (!audioCtx) return;

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === "click") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === "flap") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === "gameover") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function playBackgroundMusicTick() {
            if (!settings.music) return;
            initAudio();
            if (!audioCtx) return;

            let notes = [261.63, 329.63, 392.00, 523.25];
            let note = notes[Math.floor(Math.random() * notes.length)];

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            osc.type = "sine";
            osc.frequency.setValueAtTime(note, now);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        }

        function triggerVibration() {
            if (settings.vibration && navigator.vibrate) {
                navigator.vibrate(40);
            }
        }

        window.saveGameProgress = function() {
            localStorage.setItem("flappyHighScore", highScore);
            localStorage.setItem("flappyCoins", coins);
            localStorage.setItem("flappyUserEmail", window.userEmail);
        }

        const coinImg = new Image();
        coinImg.src = "coin.png";

        const settingImg = new Image();
        settingImg.src = "setting.png";

        let clouds = [
            { x: 50, y: 80, scale: 0.8, speed: 0.3 },
            { x: 220, y: 120, scale: 1.1, speed: 0.5 },
            { x: 380, y: 60, scale: 0.6, speed: 0.2 }
        ];

        let mountainX = 0;

        const skinManager = new SkinManager();
        let storeTab = "BIRD";

        let bird = {
            x: 80,
            y: 200,
            width: 32,
            height: 24,
            gravity: 0.35,
            lift: -7.5,
            velocity: 0,
            wingAngle: 0
        };

        let pipes = [];
        let pipeWidth = 60;
        let pipeCapHeight = 24;
        let pipeCapExtra = 6;
        let pipeGap = 140;
        let pipeSpeed = 2.5;
        let spawnTimer = 0;

        let clickedButton = null;
        let clickAnimTimer = 0;
        let idleAnimCounter = 0;

        function spawnPipe() {
            let minHeight = 40;
            let maxHeight = canvas.height - pipeGap - 90;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - pipeGap,
                passed: false
            });
        }

        function resetGame() {
            bird.y = 200;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            spawnTimer = 0;
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                if (window.gameState === "PLAYING") {
                    bird.velocity = bird.lift;
                    bird.wingAngle = -0.8;
                    playSound("flap");
                    triggerVibration();
                    e.preventDefault();
                } else if (window.gameState === "GAMEOVER") {
                    window.gameState = "MENU";
                    playSound("click");
                }
            }
        });

        canvas.addEventListener("click", (e) => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            if (window.gameState === "LOGIN") {
                // Google Login Button
                if (mouseX >= 60 && mouseX <= 340 && mouseY >= 230 && mouseY <= 285) {
                    triggerClick("google_login", () => {
                        if (typeof window.realGoogleLogin === "function") {
                            window.realGoogleLogin();
                        }
                    });
                }
                // Play as Guest Button
                if (mouseX >= 60 && mouseX <= 340 && mouseY >= 300 && mouseY <= 355) {
                    triggerClick("guest_login", () => {
                        window.userEmail = "guest_player@local";
                        localStorage.setItem("flappyUserEmail", window.userEmail);
                        window.gameState = "MENU";
                    });
                }
            } else if (window.gameState === "MENU") {
                let distToGear = Math.hypot(mouseX - 30, mouseY - 30);
                if (distToGear <= 18) {
                    triggerClick("gear", () => {
                        window.gameState = "SETTINGS";
                    });
                    return;
                }

                if (mouseX >= 100 && mouseX <= 300 && mouseY >= 195 && mouseY <= 245) {
                    triggerClick("play", () => {
                        resetGame();
                        window.gameState = "PLAYING";
                    });
                }
                if (mouseX >= 100 && mouseX <= 300 && mouseY >= 260 && mouseY <= 310) {
                    triggerClick("store", () => {
                        window.gameState = "STORE";
                        storeTab = "BIRD";
                    });
                }
                if (mouseX >= 100 && mouseX <= 300 && mouseY >= 325 && mouseY <= 375) {
                    triggerClick("leaderboard", () => {
                        window.gameState = "LEADERBOARD";
                    });
                }
            } else if (window.gameState === "SETTINGS") {
                if (mouseX >= 15 && mouseX <= 85 && mouseY >= 14 && mouseY <= 46) {
                    triggerClick("back", () => {
                        window.gameState = "MENU";
                    });
                    return;
                }
                if (mouseX >= 240 && mouseX <= 320 && mouseY >= 210 && mouseY <= 250) {
                    settings.music = !settings.music;
                    playSound("click");
                }
                if (mouseX >= 240 && mouseX <= 320 && mouseY >= 270 && mouseY <= 310) {
                    settings.sound = !settings.sound;
                    playSound("click");
                }
                if (mouseX >= 240 && mouseX <= 320 && mouseY >= 330 && mouseY <= 370) {
                    settings.vibration = !settings.vibration;
                    playSound("click");
                }
            } else if (window.gameState === "LEADERBOARD" || window.gameState === "STORE") {
                if (mouseX >= 15 && mouseX <= 85 && mouseY >= 14 && mouseY <= 46) {
                    triggerClick("back", () => {
                        window.gameState = "MENU";
                    });
                }

                if (window.gameState === "STORE") {
                    if (mouseX >= 92 && mouseX <= 172 && mouseY >= 14 && mouseY <= 46) {
                        storeTab = "BIRD";
                        playSound("click");
                    }
                    if (mouseX >= 178 && mouseX <= 282 && mouseY >= 14 && mouseY <= 46) {
                        storeTab = "BACKGROUND";
                        playSound("click");
                    }

                    let itemsList = storeTab === "BIRD" ? skinManager.skins : skinManager.backgrounds;

                    for (let i = 0; i < itemsList.length; i++) {
                        let col = i % 3;
                        let row = Math.floor(i / 3);
                        let boxX = 25 + col * 122;
                        let boxY = 62 + row * 84;

                        if (mouseX >= boxX && mouseX <= boxX + 112 && mouseY >= boxY && mouseY <= boxY + 78) {
                            if (storeTab === "BIRD") {
                                let result = skinManager.selectOrBuySkin(i, coins);
                                if (result.success) {
                                    coins -= result.coinsSpent;
                                    saveGameProgress();
                                    playSound("click");
                                }
                            } else {
                                let result = skinManager.selectOrBuyBackground(i, coins);
                                if (result.success) {
                                    coins -= result.coinsSpent;
                                    saveGameProgress();
                                    playSound("click");
                                }
                            }
                        }
                    }
                }
            } else if (window.gameState === "PLAYING") {
                bird.velocity = bird.lift;
                bird.wingAngle = -0.8;
                playSound("flap");
                triggerVibration();
            } else if (window.gameState === "GAMEOVER") {
                let pY = 130;
                if (mouseX >= 110 && mouseX <= 290 && mouseY >= pY + 130 && mouseY <= pY + 170) {
                    triggerClick("retry", () => {
                        resetGame();
                        window.gameState = "PLAYING";
                    });
                }
                if (mouseX >= 110 && mouseX <= 290 && mouseY >= pY + 185 && mouseY <= pY + 225) {
                    triggerClick("popup_menu", () => {
                        window.gameState = "MENU";
                    });
                }
            }
        });

        function triggerClick(btnName, action) {
            clickedButton = btnName;
            clickAnimTimer = 8;
            playSound("click");
            setTimeout(action, 120);
        }

        function drawWoodenButton(text, x, y, w, h, btnKey) {
            let isPressed = (clickedButton === btnKey && clickAnimTimer > 0);
            let scale = isPressed ? 0.95 : (1 + Math.sin(idleAnimCounter * 1.5) * 0.02);
            
            let currentW = w * scale;
            let currentH = h * scale;
            let currentX = x + (w - currentW) / 2;
            let currentY = y + (h - currentH) / 2 + (isPressed ? 4 : 0);

            ctx.fillStyle = "#113822";
            ctx.beginPath();
            ctx.roundRect(currentX, currentY + 4, currentW, currentH, 8);
            ctx.fill();

            let grad = ctx.createLinearGradient(currentX, currentY, currentX, currentY + currentH);
            grad.addColorStop(0, "#52b788");
            grad.addColorStop(0.5, "#40916c");
            grad.addColorStop(1, "#2d6a4f");

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(currentX, currentY, currentW, currentH, 8);
            ctx.fill();

            ctx.strokeStyle = "#9ef01a";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(currentX + 2, currentY + 2, currentW - 4, currentH - 4, 6);
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            let fontSize = Math.round(13 * scale);
            ctx.font = `bold ${fontSize}px 'Segoe UI', monospace`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "#000";
            ctx.shadowBlur = 3;
            ctx.fillText(text, currentX + currentW / 2, currentY + currentH / 2);
            ctx.shadowBlur = 0;
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
        }

        function drawActiveBackground() {
            let bg = skinManager.getCurrentBackground();
            
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, bg.top);
            skyGrad.addColorStop(0.5, bg.mid);
            skyGrad.addColorStop(1, bg.bot);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (window.gameState === "PLAYING" || window.gameState === "MENU" || window.gameState === "SETTINGS" || window.gameState === "STORE" || window.gameState === "LEADERBOARD") {
                mountainX -= 0.5;
                if (mountainX <= -400) mountainX = 0;
            }

            ctx.fillStyle = bg.mountain;
            for (let i = 0; i < 2; i++) {
                let mOffset = mountainX + (i * 400);
                ctx.beginPath();
                ctx.moveTo(mOffset, canvas.height - 45);
                ctx.lineTo(mOffset + 0, canvas.height - 150);
                ctx.lineTo(mOffset + 110, canvas.height - 230);
                ctx.lineTo(mOffset + 230, canvas.height - 140);
                ctx.lineTo(mOffset + 340, canvas.height - 210);
                ctx.lineTo(mOffset + 400, canvas.height - 150);
                ctx.lineTo(mOffset + 400, canvas.height - 45);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x < -60) c.x = canvas.width + 60;
                drawSingleCloud(c.x, c.y, c.scale);
            });

            ctx.fillStyle = "#1b4332";
            ctx.fillRect(0, canvas.height - 45, canvas.width, 45);
            ctx.fillStyle = "#52b788";
            ctx.fillRect(0, canvas.height - 45, canvas.width, 9);
        }

        function drawSingleCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.arc(14, -8, 13, 0, Math.PI * 2);
            ctx.arc(26, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPipe(x, topHeight, bottomHeight) {
            let gradientTop = ctx.createLinearGradient(x, 0, x + pipeWidth, 0);
            gradientTop.addColorStop(0, "#2a9d8f");
            gradientTop.addColorStop(0.5, "#52b788");
            gradientTop.addColorStop(1, "#1b4332");

            ctx.fillStyle = gradientTop;
            ctx.fillRect(x, 0, pipeWidth, topHeight - pipeCapHeight);
            ctx.strokeStyle = "#0b2518";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, 0, pipeWidth, topHeight - pipeCapHeight);

            ctx.fillRect(x - pipeCapExtra, topHeight - pipeCapHeight, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);
            ctx.strokeRect(x - pipeCapExtra, topHeight - pipeCapHeight, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);

            let bottomY = canvas.height - bottomHeight;
            ctx.fillRect(x - pipeCapExtra, bottomY, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);
            ctx.strokeRect(x - pipeCapExtra, bottomY, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);

            ctx.fillRect(x, bottomY + pipeCapHeight, pipeWidth, bottomHeight - pipeCapHeight);
            ctx.strokeRect(x, bottomY + pipeCapHeight, pipeWidth, bottomHeight - pipeCapHeight);
        }

        function drawInGameBird(x, y) {
            ctx.save();
            ctx.translate(x + bird.width / 2, y + bird.height / 2);
            let rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.08));
            ctx.rotate(rot);

            skinManager.drawBirdGraphic(ctx, 0, 0, 1.1, skinManager.currentIndex, bird.wingAngle);
            ctx.restore();
        }

        function update() {
            if (clickAnimTimer > 0) clickAnimTimer--;
            idleAnimCounter += 0.05;

            if (window.gameState === "PLAYING" || window.gameState === "MENU" || window.gameState === "LOGIN") {
                musicTimer++;
                if (musicTimer > 50) {
                    playBackgroundMusicTick();
                    musicTimer = 0;
                }
            }

            if (bird.wingAngle < 0) {
                bird.wingAngle += 0.15;
                if (bird.wingAngle > 0) bird.wingAngle = 0;
            }

            if (window.gameState !== "PLAYING") return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y + bird.height >= canvas.height - 45) {
                bird.y = canvas.height - 45 - bird.height;
                window.gameState = "GAMEOVER";
                playSound("gameover");
                triggerVibration();
            }
            if (bird.y <= 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            spawnTimer++;
            if (spawnTimer > 100) {
                spawnPipe();
                spawnTimer = 0;
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= pipeSpeed;

                if (
                    bird.x < p.x + pipeWidth &&
                    bird.x + bird.width > p.x &&
                    (bird.y < p.top || bird.y + bird.height > canvas.height - p.bottom)
                ) {
                    window.gameState = "GAMEOVER";
                    playSound("gameover");
                    triggerVibration();
                }

                if (!p.passed && p.x + pipeWidth < bird.x) {
                    score += 1;
                    coins += 1;
                    p.passed = true;
                    if (score > highScore) {
                        highScore = score;
                    }
                    saveGameProgress();
                }

                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (window.gameState === "LOGIN") {
                drawActiveBackground();

                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px 'Segoe UI', monospace";
                ctx.textAlign = "center";
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 8;
                ctx.fillText("WELCOME TO FLAPPY", canvas.width / 2, 110);
                ctx.font = "13px 'Segoe UI', monospace";
                ctx.fillStyle = "#b7e4c7";
                ctx.fillText("Choose login method to start", canvas.width / 2, 140);
                ctx.shadowBlur = 0;

                // 1. Google Login Button
                let btnX = 60, btnY = 230, btnW = 280, btnH = 50;
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, btnW, btnH, 8);
                ctx.fill();
                ctx.strokeStyle = "#52b788";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = "#4285F4";
                ctx.font = "bold 18px 'Segoe UI', sans-serif";
                ctx.textAlign = "left";
                ctx.fillText("G", btnX + 25, btnY + 31);

                ctx.fillStyle = "#333333";
                ctx.font = "bold 14px 'Segoe UI', sans-serif";
                ctx.fillText("Sign in with Google", btnX + 60, btnY + 30);

                // 2. Play as Guest Button
                let guestY = 300;
                ctx.fillStyle = "#2d6a4f";
                ctx.beginPath();
                ctx.roundRect(btnX, guestY, btnW, btnH, 8);
                ctx.fill();
                ctx.strokeStyle = "#9ef01a";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px 'Segoe UI', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Play as Guest (Instant Start)", btnX + btnW / 2, guestY + 30);
                ctx.textAlign = "left";

            } else if (window.gameState === "MENU") {
                drawActiveBackground();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 32px 'Segoe UI', monospace";
                ctx.textAlign = "center";
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 8;
                ctx.fillText("FLAPPY BIRD", canvas.width / 2, 110);
                ctx.shadowBlur = 0;

                if (settingImg.complete && settingImg.naturalWidth !== 0) {
                    ctx.drawImage(settingImg, 17, 17, 26, 26);
                } else {
                    ctx.fillStyle = "#222222";
                    ctx.beginPath();
                    ctx.arc(30, 30, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#888888";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 13px 'Segoe UI', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("⚙", 30, 30);
                    ctx.textBaseline = "alphabetic";
                }

                drawWoodenButton("PLAY GAME", 100, 195, 200, 50, "play");
                drawWoodenButton("STORE / SKINS", 100, 260, 200, 50, "store");
                drawWoodenButton("LEADERBOARD", 100, 325, 200, 50, "leaderboard");

            } else if (window.gameState === "SETTINGS") {
                ctx.fillStyle = "#1b4332";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawWoodenButton("<- BACK", 15, 14, 70, 32, "back");

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px 'Segoe UI', monospace";
                ctx.textAlign = "center";
                ctx.fillText("SETTINGS", canvas.width / 2, 65);

                let boxX = 35, boxY = 85, boxW = 330, boxH = 310;
                ctx.fillStyle = "#133121";
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxW, boxH, 12);
                ctx.fill();
                ctx.strokeStyle = "#52b788";
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = "#b7e4c7";
                ctx.font = "bold 12px 'Segoe UI', monospace";
                ctx.textAlign = "left";
                ctx.fillText("CONNECTED ACCOUNT", boxX + 20, boxY + 30);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px 'Segoe UI', monospace";
                ctx.fillText("📧 " + (window.userEmail || "Not Logged In"), boxX + 20, boxY + 55);

                ctx.strokeStyle = "#2d6a4f";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(boxX + 20, boxY + 72);
                ctx.lineTo(boxX + boxW - 20, boxY + 72);
                ctx.stroke();

                function drawSettingRow(label, status, yPos) {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 15px 'Segoe UI', monospace";
                    ctx.textAlign = "left";
                    ctx.fillText(label, boxX + 20, yPos);

                    let btnColor = status ? "#2d6a4f" : "#6f1d1b";
                    let txtColor = status ? "#9ef01a" : "#ff758f";
                    let txt = status ? "ON" : "OFF";

                    ctx.fillStyle = btnColor;
                    ctx.beginPath();
                    ctx.roundRect(boxX + 215, yPos - 20, 75, 30, 6);
                    ctx.fill();
                    ctx.strokeStyle = txtColor;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.fillStyle = txtColor;
                    ctx.textAlign = "center";
                    ctx.font = "bold 13px 'Segoe UI', monospace";
                    ctx.fillText(txt, boxX + 252.5, yPos - 1);
                }

                drawSettingRow("Background Music", settings.music, boxY + 115);
                drawSettingRow("Sound Effects", settings.sound, boxY + 175);
                drawSettingRow("Vibration", settings.vibration, boxY + 235);
                ctx.textAlign = "left";

            } else if (window.gameState === "LEADERBOARD") {
                ctx.fillStyle = "#1b4332";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawWoodenButton("<- BACK", 15, 14, 70, 32, "back");

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px 'Segoe UI', monospace";
                ctx.textAlign = "center";
                ctx.fillText("LEADERBOARD", canvas.width / 2, 90);

                let boxX = 60, boxY = 130, boxW = 280, boxH = 220;
                ctx.fillStyle = "#133121";
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxW, boxH, 12);
                ctx.fill();
                ctx.strokeStyle = "#52b788";
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 16px 'Segoe UI', monospace";
                ctx.fillText("🇮🇳 India Rank & High Score", canvas.width / 2, boxY + 40);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px 'Segoe UI', monospace";
                ctx.fillText("Score: " + highScore, canvas.width / 2, boxY + 90);

                ctx.fillStyle = "#9ef01a";
                ctx.font = "bold 15px 'Segoe UI', monospace";
                ctx.fillText("Rank: Local Mode", canvas.width / 2, boxY + 135);

                ctx.fillStyle = "#b7e4c7";
                ctx.font = "12px 'Segoe UI', monospace";
                ctx.fillText("Connected: " + (window.userEmail ? window.userEmail.split('@')[0] : "Guest"), canvas.width / 2, boxY + 175);

            } else if (window.gameState === "STORE") {
                ctx.fillStyle = "#1b4332";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawWoodenButton("<- BACK", 15, 14, 70, 32, "back");
                drawWoodenButton("BIRDS", 90, 14, 75, 32, "tab_birds");
                drawWoodenButton("BACKGROUNDS", 170, 14, 105, 32, "tab_bgs");

                let storeCoinX = 285;
                if (coinImg.complete && coinImg.naturalWidth !== 0) {
                    ctx.drawImage(coinImg, storeCoinX, 20, 18, 18);
                }
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 14px 'Segoe UI', monospace";
                ctx.textAlign = "left";
                ctx.fillText(coins, storeCoinX + 22, 34);

                let itemsList = storeTab === "BIRD" ? skinManager.skins : skinManager.backgrounds;
                let activeIdx = storeTab === "BIRD" ? skinManager.currentIndex : skinManager.bgIndex;

                for (let i = 0; i < itemsList.length; i++) {
                    let col = i % 3;
                    let row = Math.floor(i / 3);
                    let boxX = 25 + col * 122;
                    let boxY = 62 + row * 84;
                    let item = itemsList[i];

                    ctx.fillStyle = activeIdx === i ? "#2d6a4f" : "#133121";
                    ctx.beginPath();
                    ctx.roundRect(boxX, boxY, 112, 78, 8);
                    ctx.fill();
                    ctx.strokeStyle = activeIdx === i ? "#9ef01a" : "#40916c";
                    ctx.lineWidth = activeIdx === i ? 2.5 : 1.5;
                    ctx.stroke();

                    if (storeTab === "BIRD") {
                        skinManager.drawBirdGraphic(ctx, boxX + 56, boxY + 28, 0.7, i);
                    } else {
                        ctx.fillStyle = item.top;
                        ctx.fillRect(boxX + 8, boxY + 8, 96, 32);
                        ctx.fillStyle = item.mountain;
                        ctx.beginPath();
                        ctx.moveTo(boxX + 8, boxY + 40);
                        ctx.lineTo(boxX + 35, boxY + 18);
                        ctx.lineTo(boxX + 65, boxY + 40);
                        ctx.closePath();
                        ctx.fill();
                    }

                    ctx.fillStyle = "#fff";
                    ctx.font = "9px 'Segoe UI', monospace";
                    ctx.textAlign = "center";
                    ctx.fillText(item.name, boxX + 56, boxY + 54);

                    if (item.unlocked) {
                        ctx.fillStyle = activeIdx === i ? "#9ef01a" : "#b7e4c7";
                        ctx.font = "bold 9px 'Segoe UI', monospace";
                        ctx.fillText(activeIdx === i ? "[EQUIPPED]" : "OWNED", boxX + 56, boxY + 69);
                    } else {
                        let priceX = boxX + 30;
                        if (coinImg.complete && coinImg.naturalWidth !== 0) {
                            ctx.drawImage(coinImg, priceX, boxY + 59, 11, 11);
                        }
                        ctx.fillStyle = "#ffcc00";
                        ctx.font = "bold 11px 'Segoe UI', monospace";
                        ctx.textAlign = "left";
                        ctx.fillText(item.price, priceX + 15, boxY + 69);
                    }
                    ctx.textAlign = "left";
                }

            } else {
                drawActiveBackground();

                pipes.forEach(p => {
                    drawPipe(p.x, p.top, p.bottom);
                });

                drawInGameBird(bird.x, bird.y);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px 'Segoe UI', monospace";
                ctx.textAlign = "center";
                ctx.fillText(score, canvas.width / 2, 50);

                if (coinImg.complete && coinImg.naturalWidth !== 0) {
                    ctx.drawImage(coinImg, 20, 16, 24, 24);
                }
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 18px 'Segoe UI', monospace";
                ctx.textAlign = "left";
                ctx.fillText(coins, 48, 34);

                if (window.gameState === "GAMEOVER") {
                    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    let pX = 80, pY = 130, pW = 240, pH = 280;
                    ctx.fillStyle = "#1b4332";
                    ctx.beginPath();
                    ctx.roundRect(pX, pY, pW, pH, 15);
                    ctx.fill();
                    ctx.strokeStyle = "#52b788";
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    ctx.fillStyle = "#ff007f";
                    ctx.font = "bold 24px 'Segoe UI', monospace";
                    ctx.textAlign = "center";
                    ctx.fillText("GAME OVER", canvas.width / 2, pY + 45);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "16px 'Segoe UI', monospace";
                    ctx.fillText("Score: " + score, canvas.width / 2, pY + 85);
                    ctx.fillText("Best: " + highScore, canvas.width / 2, pY + 115);

                    drawWoodenButton("PLAY AGAIN", 110, pY + 130, 180, 40, "retry");
                    drawWoodenButton("MAIN MENU", 110, pY + 185, 180, 40, "popup_menu");

                    ctx.textAlign = "left";
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
