<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Desktop Cloud Game</title>
    <style>
        body {
            margin: 0;
            background-color: #0b131a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            width: 360px;
            height: 640px;
            border: 4px solid #1b4332;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            background: #1b4332;
        }
        .instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #b7e4c7;
            text-align: center;
        }
    </style>
    <script src="skins.js"></script>

    <!-- Firebase SDK Modular CDN (Auth & Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYTo_Flsgdj_3ktQ3FB704xgbTSppLpt0",
            authDomain: "chess-arena-eb263.firebaseapp.com",
            projectId: "chess-arena-eb263",
            storageBucket: "chess-arena-eb263.appspot.com",
            messagingSenderId: "735495318337",
            appId: "1:735495318337:web:c058d5829d8fdbd9448fc0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.db = db;
        window.auth = auth;
        window.leaderboardData = [];
        window.isLeaderboardLoading = false;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.userEmail = user.email;
                await window.loadCloudGameData(user.email, true);
            } else {
                window.gameState = "LOGIN";
            }
        });

        window.loadCloudGameData = async function(email, checkProfile = false) {
            try {
                const docRef = doc(db, "flappy_users", email);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    window.highScore = data.highScore || 0;
                    window.coins = data.coins !== undefined ? data.coins : 0;
                    window.username = data.username || "";
                    window.userCountry = data.userCountry || "";
                    
                    if (data.unlockedSkins && window.skinManager) {
                        window.skinManager.loadUnlockedSkins(data.unlockedSkins);
                    }
                    if (data.unlockedBgs && window.skinManager) {
                        window.skinManager.loadUnlockedBgs(data.unlockedBgs);
                    }
                    if (data.activeSkinIndex !== undefined && window.skinManager) {
                       window.skinManager.currentIndex = data.activeSkinIndex;
                    }
                    if (data.activeBgIndex !== undefined && window.skinManager) {
                       window.skinManager.bgIndex = data.activeBgIndex;
                    }

                    if (checkProfile) {
                        if (!window.username || !window.userCountry) {
                            window.gameState = "PROFILE_SETUP";
                        } else {
                            window.gameState = "MENU";
                        }
                    }
                } else {
                    window.highScore = 0;
                    window.coins = 0;
                    window.username = "";
                    window.userCountry = "";
                    if (checkProfile) {
                        window.gameState = "PROFILE_SETUP";
                    }
                }
            } catch (e) {
                console.error("Error loading from cloud: ", e);
                window.gameState = "MENU";
            }
        };

        window.isUsernameUnique = async function(usernameToCheck) {
            try {
                const usersRef = collection(db, "flappy_users");
                const querySnapshot = await getDocs(usersRef);
                let unique = true;
                querySnapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    if (d.username && d.username.toLowerCase() === usernameToCheck.toLowerCase() && d.email !== window.userEmail) {
                        unique = false;
                    }
                });
                return unique;
            } catch (e) {
                console.error("Error checking uniqueness:", e);
                return true;
            }
        };

        window.saveCloudGameData = async function() {
            if (!window.userEmail) return;
            try {
                const docRef = doc(db, "flappy_users", window.userEmail);
                await setDoc(docRef, {
                    email: window.userEmail,
                    highScore: window.highScore,
                    coins: window.coins,
                    username: window.username,
                    userCountry: window.userCountry,
                    unlockedSkins: window.skinManager ? window.skinManager.getUnlockedSkins() : [0],
                    unlockedBgs: window.skinManager ? window.skinManager.getUnlockedBgs() : [0],
                    activeSkinIndex: window.skinManager ? window.skinManager.currentIndex : 0,
                    activeBgIndex: window.skinManager ? window.skinManager.bgIndex : 0,
                    updatedAt: new Date()
                }, { merge: true });
            } catch (e) {
                console.error("Error saving to cloud: ", e);
            }
        };

        window.fetchLeaderboard = async function() {
            window.isLeaderboardLoading = true;
            try {
                const usersRef = collection(db, "flappy_users");
                const q = query(usersRef, orderBy("highScore", "desc"), limit(50));
                const querySnapshot = await getDocs(q);
                let list = [];
                querySnapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    if (d.username) {
                        list.push({
                            username: d.username,
                            country: d.userCountry || "N/A",
                            highScore: d.highScore || 0,
                            email: d.email
                        });
                    }
                });
                window.leaderboardData = list;
            } catch (e) {
                console.error("Error fetching leaderboard:", e);
            } finally {
                window.isLeaderboardLoading = false;
            }
        };

        window.realGoogleLogin = function() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    window.userEmail = user.email;
                    window.loadCloudGameData(user.email, true);
                })
                .catch((error) => {
                    console.error("Login failed:", error);
                });
        };

        window.logoutUser = function() {
            signOut(auth).then(() => {
                window.userEmail = null;
                window.username = "";
                window.userCountry = "";
                window.gameState = "LOGIN";
            }).catch((error) => {
                console.error("Logout error:", error);
            });
        };
    </script>
</head>
<body>

            "Kenya", "Kuwait", "Kyrgyzstan", "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein",
            "Lithuania", "Luxembourg", "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Mauritania", "Mauritius",

            "Trinidad and Tobago", "Tunisia", "Turkey", "Turkmenistan", "Tuvalu", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States",
            "Uruguay", "Uzbekistan", "Vanuatu", "Vatican City", "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabwe"
        ];

        let settings = { music: true, sound: true, vibration: true };
        let audioCtx = null;
        let musicTimer = 0;

        let leaderboardScrollOffset = 0;

        // NEW FEATURE: Dynamic Weather & Particles (Stars & Rain based on Score/Time)
        let weatherParticles = [];
        for(let i=0; i<30; i++) {
            weatherParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: 100 + Math.random() * 150,
                size: 1 + Math.random() * 2
            });
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!settings.sound) return;
            initAudio();
            if (!audioCtx) return;

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === "click") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === "flap") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === "gameover") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function playBackgroundMusicTick() {
            if (!settings.music) return;
            initAudio();
            if (!audioCtx) return;
            let notes = [261.63, 329.63, 392.00, 523.25];
            let note = notes[Math.floor(Math.random() * notes.length)];
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;
            osc.type = "sine";
            osc.frequency.setValueAtTime(note, now);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        }

        const coinImg = new Image(); coinImg.src = "coin.png";
        const settingImg = new Image(); settingImg.src = "setting.png";

        let clouds = [
            { x: 50, y: 80, scale: 0.8, speed: 30 },
            { x: 200, y: 120, scale: 1.1, speed: 50 },
            { x: 310, y: 60, scale: 0.6, speed: 20 }
        ];

        let mountainX = 0;
        let storeTab = "BIRD";
        let bird = { x: 70, y: 250, width: 32, height: 24, gravity: 1200, lift: -360, velocity: 0, wingAngle: 0 };
        let pipes = [];
        let pipeWidth = 55;
        let pipeCapHeight = 22;
        let pipeCapExtra = 5;
        let pipeGap = 135;
        let pipeSpeed = 180;
        let spawnTimer = 0;

        let clickedButton = null;
        let clickAnimTimer = 0;
        let idleAnimCounter = 0;

        let inputActiveField = "username";
        let inputUsernameVal = "";
        let inputCountryVal = "";
        let setupErrorMsg = "";

        // Sync mobile input with active field variables
        mobileInput.addEventListener("input", (e) => {
            if (window.gameState === "PROFILE_SETUP") {
                let val = mobileInput.value;
                if (inputActiveField === "username") {
                    inputUsernameVal = val.slice(0, 15);
                } else if (inputActiveField === "country") {
                    inputCountryVal = val.slice(0, 20);
                }
            }
        });

        window.addEventListener("wheel", (e) => {
            if (window.gameState === "LEADERBOARD") {
                leaderboardScrollOffset += e.deltaY * 0.4;
                let maxScroll = Math.max(0, (window.leaderboardData.length * 30) - 340);
                if (leaderboardScrollOffset < 0) leaderboardScrollOffset = 0;
                if (leaderboardScrollOffset > maxScroll) leaderboardScrollOffset = maxScroll;
            }
        }, { passive: true });

        window.addEventListener("keydown", async (e) => {
            if (window.gameState === "PROFILE_SETUP") {
                if (e.key === "Tab") {
                    e.preventDefault();
                    inputActiveField = inputActiveField === "username" ? "country" : "username";
                    mobileInput.value = inputActiveField === "username" ? inputUsernameVal : inputCountryVal;
                    mobileInput.focus();
                    playSound("click");
                } else if (e.key === "Backspace") {
                    if (inputActiveField === "username") {
                        inputUsernameVal = inputUsernameVal.slice(0, -1);
                    } else {
                        inputCountryVal = inputCountryVal.slice(0, -1);
                    }
                    mobileInput.value = inputActiveField === "username" ? inputUsernameVal : inputCountryVal;
                    playSound("click");
                }
                return;
            }

            if (window.gameState === "LEADERBOARD") {
                if (e.key === "ArrowDown") {
                    leaderboardScrollOffset = Math.min(Math.max(0, (window.leaderboardData.length * 30) - 340), leaderboardScrollOffset + 30);
                } else if (e.key === "ArrowUp") {
                    leaderboardScrollOffset = Math.max(0, leaderboardScrollOffset - 30);
                }
            }

            if (e.code === "Space") {
                if (window.gameState === "PLAYING") {
                    bird.velocity = bird.lift;
                    bird.wingAngle = -0.8;
                    playSound("flap");
                    e.preventDefault();
                } else if (window.gameState === "GAMEOVER") {
                    window.gameState = "MENU";
                    playSound("click");
                } else if (window.gameState === "MENU") {
                    resetGame(); window.gameState = "PLAYING";
                    e.preventDefault();
                }
            }
        });

        canvas.addEventListener("click", async (e) => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = ((e.clientX - rect.left) / rect.width) * canvas.width;
            let mouseY = ((e.clientY - rect.top) / rect.height) * canvas.height;

            if (window.gameState === "LOGIN") {
                if (mouseX >= 40 && mouseX <= 320 && mouseY >= 310 && mouseY <= 365) {
                    triggerClick("google_login", () => {
                        if (typeof window.realGoogleLogin === "function") window.realGoogleLogin();
                    });
                }
            } else if (window.gameState === "PROFILE_SETUP") {
                if (mouseX >= 50 && mouseX <= 310 && mouseY >= 210 && mouseY <= 260) {
                    inputActiveField = "username";
                    mobileInput.value = inputUsernameVal;
                    mobileInput.focus();
                    playSound("click");
                } else if (mouseX >= 50 && mouseX <= 310 && mouseY >= 300 && mouseY <= 350) {
                    inputActiveField = "country";
                    mobileInput.value = inputCountryVal;
                    mobileInput.focus();
                    playSound("click");
                } else if (mouseX >= 80 && mouseX <= 280 && mouseY >= 420 && mouseY <= 470) {
                    mobileInput.blur();
                    let cleanUser = inputUsernameVal.trim();
                    let cleanCountryInput = inputCountryVal.trim().toLowerCase();

                    if (cleanUser.length < 3) {
                        setupErrorMsg = "Username min 3 chars!";
                        return;
                    }

                    let matchedCountry = allWorldCountries.find(c => c.toLowerCase() === cleanCountryInput);
                    if (!matchedCountry) {
                        setupErrorMsg = "Enter a valid world country!";
                        return;
                    }

                    setupErrorMsg = "Checking uniqueness...";
                    let unique = await window.isUsernameUnique(cleanUser);
                    if (!unique) {
                        setupErrorMsg = "Username already taken!";
                        return;
                    }

                    window.username = cleanUser;
                    window.userCountry = matchedCountry;
                    setupErrorMsg = "";

                    await window.saveCloudGameData();
                    triggerClick("save_profile", () => {
                        window.gameState = "MENU";
                    });
                }
            } else if (window.gameState === "MENU") {
                let distToGear = Math.hypot(mouseX - 30, mouseY - 30);
                if (distToGear <= 25) {
                    triggerClick("gear", () => { window.gameState = "SETTINGS"; });
                    return;
                }

                if (mouseX >= 80 && mouseX <= 280 && mouseY >= 250 && mouseY <= 305) {
                    triggerClick("play", () => { resetGame(); window.gameState = "PLAYING"; });
                }
                if (mouseX >= 80 && mouseX <= 280 && mouseY >= 320 && mouseY <= 375) {
                    triggerClick("store", () => { window.gameState = "STORE"; storeTab = "BIRD"; });
                }
                if (mouseX >= 80 && mouseX <= 280 && mouseY >= 390 && mouseY <= 445) {
                    triggerClick("leaderboard", () => {
                        window.gameState = "LEADERBOARD";
                        leaderboardScrollOffset = 0;
                        if (typeof window.fetchLeaderboard === "function") window.fetchLeaderboard();
                    });
                }
            } else if (window.gameState === "SETTINGS") {
                if (mouseX >= 15 && mouseX <= 90 && mouseY >= 14 && mouseY <= 46) {
                    triggerClick("back", () => { window.gameState = "MENU"; });
                    return;
                }
                if (mouseX >= 220 && mouseX <= 300 && mouseY >= 220 && mouseY <= 260) {
                    settings.music = !settings.music; playSound("click");
                }
                if (mouseX >= 220 && mouseX <= 300 && mouseY >= 280 && mouseY <= 320) {
                    settings.sound = !settings.sound; playSound("click");
                }
                if (mouseX >= 45 && mouseX <= 315 && mouseY >= 415 && mouseY <= 455) {
                    triggerClick("logout", () => {
                        if (typeof window.logoutUser === "function") window.logoutUser();
                    });
                }
            } else if (window.gameState === "LEADERBOARD" || window.gameState === "STORE") {
                if (mouseX >= 15 && mouseX <= 90 && mouseY >= 14 && mouseY <= 46) {
                    triggerClick("back", () => { window.gameState = "MENU"; });
                    return;
                }

                if (window.gameState === "STORE") {
                    if (mouseX >= 82 && mouseX <= 150 && mouseY >= 14 && mouseY <= 44) { storeTab = "BIRD"; playSound("click"); return; }
                    if (mouseX >= 155 && mouseX <= 260 && mouseY >= 14 && mouseY <= 44) { storeTab = "BACKGROUND"; playSound("click"); return; }

                    let itemsList = storeTab === "BIRD" ? skinManager.skins : skinManager.backgrounds;
                    for (let i = 0; i < itemsList.length; i++) {
                        let col = i % 3;
                        let row = Math.floor(i / 3);
                        let boxX = 20 + col * 108;
                        let boxY = 65 + row * 82;

                        if (mouseX >= boxX && mouseX <= boxX + 102 && mouseY >= boxY && mouseY <= boxY + 76) {
                            if (storeTab === "BIRD") {
                                let res = skinManager.selectOrBuySkin(i, window.coins);
                                if (res.success) { window.coins -= res.coinsSpent; window.saveCloudGameData(); playSound("click"); }
                            } else {
                                let res = skinManager.selectOrBuyBackground(i, window.coins);
                                if (res.success) { window.coins -= res.coinsSpent; window.saveCloudGameData(); playSound("click"); }
                            }
                        }
                    }
                }
            } else if (window.gameState === "PLAYING") {
                bird.velocity = bird.lift;
                bird.wingAngle = -0.8;
                playSound("flap");
            } else if (window.gameState === "GAMEOVER") {
                let pY = 160;
                if (mouseX >= 90 && mouseX <= 270 && mouseY >= pY + 140 && mouseY <= pY + 180) {
                    triggerClick("retry", () => { resetGame(); window.gameState = "PLAYING"; });
                }
                if (mouseX >= 90 && mouseX <= 270 && mouseY >= pY + 195 && mouseY <= pY + 235) {
                    triggerClick("popup_menu", () => { window.gameState = "MENU"; });
                }
            }
        });

        function triggerClick(btnName, action) {
            clickedButton = btnName;
            clickAnimTimer = 8;
            playSound("click");
            setTimeout(action, 120);
        }

        function drawWoodenButton(text, x, y, w, h, btnKey) {
            let isPressed = (clickedButton === btnKey && clickAnimTimer > 0);
            let scale = isPressed ? 0.95 : (1 + Math.sin(idleAnimCounter * 1.5) * 0.02);
            let currentW = w * scale;
            let currentH = h * scale;
            let currentX = x + (w - currentW) / 2;
            let currentY = y + (h - currentH) / 2 + (isPressed ? 4 : 0);

            ctx.fillStyle = "#113822";
            ctx.beginPath();
            ctx.roundRect(currentX, currentY + 4, currentW, currentH, 8);
            ctx.fill();

            let grad = ctx.createLinearGradient(currentX, currentY, currentX, currentY + currentH);
            grad.addColorStop(0, "#52b788"); grad.addColorStop(0.5, "#40916c"); grad.addColorStop(1, "#2d6a4f");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(currentX, currentY, currentW, currentH, 8);
            ctx.fill();

            ctx.strokeStyle = "#9ef01a";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(currentX + 2, currentY + 2, currentW - 4, currentH - 4, 6);
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            let fontSize = Math.round(11 * scale);
            ctx.font = `bold ${fontSize}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, currentX + currentW / 2, currentY + currentH / 2);
            ctx.textBaseline = "alphabetic";
        }

        function drawActiveBackground(dt) {
            let bg = skinManager.getCurrentBackground();
            
            // Dynamic Weather Shift based on score (Every 5 points toggles evening/night/rain aura)
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (score >= 5 && score < 10) {
                // Evening Theme
                skyGrad.addColorStop(0, "#2b2d42"); skyGrad.addColorStop(0.5, "#8d99ae"); skyGrad.addColorStop(1, "#d90429");
            } else if (score >= 10) {
                // Night Theme with stars
                skyGrad.addColorStop(0, "#03071e"); skyGrad.addColorStop(0.5, "#10002b"); skyGrad.addColorStop(1, "#240046");
            } else {
                skyGrad.addColorStop(0, bg.top); skyGrad.addColorStop(0.5, bg.mid); skyGrad.addColorStop(1, bg.bot);
            }

            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (window.gameState !== "GAMEOVER") {
                mountainX -= 30 * dt;
                if (mountainX <= -360) mountainX = 0;
            }

            ctx.fillStyle = bg.mountain;
            for (let i = 0; i < 2; i++) {
                let mOffset = mountainX + (i * 360);
                ctx.beginPath();
                ctx.moveTo(mOffset, canvas.height - 45);
                ctx.lineTo(mOffset + 0, canvas.height - 140);
                ctx.lineTo(mOffset + 100, canvas.height - 210);
                ctx.lineTo(mOffset + 210, canvas.height - 130);
                ctx.lineTo(mOffset + 300, canvas.height - 190);
                ctx.lineTo(mOffset + 360, canvas.height - 140);
                ctx.lineTo(mOffset + 360, canvas.height - 45);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
            clouds.forEach(c => {
                c.x -= c.speed * dt;
                if (c.x < -50) c.x = canvas.width + 50;
                drawSingleCloud(c.x, c.y, c.scale);
            });

            // Draw Weather Particles (Rain/Stars effect)
            if (score >= 5) {
                ctx.fillStyle = score >= 10 ? "#ffffff" : "rgba(173, 216, 230, 0.6)";
                weatherParticles.forEach(p => {
                    p.y += p.speed * dt;
                    if (p.y > canvas.height) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            ctx.fillStyle = "#1b4332";
            ctx.fillRect(0, canvas.height - 45, canvas.width, 45);
            ctx.fillStyle = "#52b788";
            ctx.fillRect(0, canvas.height - 45, canvas.width, 9);
        }

        function drawSingleCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.arc(12, -7, 11, 0, Math.PI * 2);
            ctx.arc(22, 0, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function spawnPipe() {
            let minHeight = 40;
            let maxHeight = canvas.height - pipeGap - 90;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - pipeGap, passed: false });
        }

        function resetGame() {
            bird.y = 250;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            spawnTimer = 0;
        }

        function update(dt) {
            if (clickAnimTimer > 0) clickAnimTimer--;
            idleAnimCounter += 0.05;

            // Auto-focus mobile keyboard when profile setup state is active
            if (window.gameState === "PROFILE_SETUP") {
                if (document.activeElement !== mobileInput) {
                    mobileInput.focus();
                }
            }

            if (window.gameState === "PLAYING" || window.gameState === "MENU" || window.gameState === "LOGIN") {
                musicTimer++;
                if (musicTimer > 50) { playBackgroundMusicTick(); musicTimer = 0; }
            }

            if (bird.wingAngle < 0) {
                bird.wingAngle += 0.15;
                if (bird.wingAngle > 0) bird.wingAngle = 0;
            }

            if (window.gameState !== "PLAYING") return;

            bird.velocity += bird.gravity * dt;
            bird.y += bird.velocity * dt;

            if (bird.y + bird.height >= canvas.height - 45) {
                bird.y = canvas.height - 45 - bird.height;
                window.gameState = "GAMEOVER";
                playSound("gameover");
            }
            if (bird.y <= 0) { bird.y = 0; bird.velocity = 0; }

            spawnTimer += dt;
            if (spawnTimer > 1.7) { spawnPipe(); spawnTimer = 0; }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= pipeSpeed * dt;

                if (
                    bird.x < p.x + pipeWidth &&
                    bird.x + bird.width > p.x &&
                    (bird.y < p.top || bird.y + bird.height > canvas.height - p.bottom)
                ) {
                    window.gameState = "GAMEOVER";
                    playSound("gameover");
                }

                if (!p.passed && p.x + pipeWidth < bird.x) {
                    score += 1;
                    window.coins += 1;
                    p.passed = true;
                    if (score > window.highScore) window.highScore = score;
                    window.saveCloudGameData();
                }

                if (p.x + pipeWidth < 0) { pipes.splice(i, 1); }
            }
        }

        function drawPipe(x, topHeight, bottomHeight) {
            let gradientTop = ctx.createLinearGradient(x, 0, x + pipeWidth, 0);
            gradientTop.addColorStop(0, "#2a9d8f"); gradientTop.addColorStop(0.5, "#52b788"); gradientTop.addColorStop(1, "#1b4332");
            ctx.fillStyle = gradientTop;
            ctx.fillRect(x, 0, pipeWidth, topHeight - pipeCapHeight);
            ctx.strokeStyle = "#0b2518"; ctx.lineWidth = 2;
            ctx.strokeRect(x, 0, pipeWidth, topHeight - pipeCapHeight);

            ctx.fillRect(x - pipeCapExtra, topHeight - pipeCapHeight, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);
            ctx.strokeRect(x - pipeCapExtra, topHeight - pipeCapHeight, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);

            let bottomY = canvas.height - bottomHeight;
            ctx.fillRect(x - pipeCapExtra, bottomY, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);
            ctx.strokeRect(x - pipeCapExtra, bottomY, pipeWidth + (pipeCapExtra * 2), pipeCapHeight);
            ctx.fillRect(x, bottomY + pipeCapHeight, pipeWidth, bottomHeight - pipeCapHeight);
            ctx.strokeRect(x, bottomY + pipeCapHeight, pipeWidth, bottomHeight - pipeCapHeight);
        }

        function drawInGameBird(x, y) {
            ctx.save();
            ctx.translate(x + bird.width / 2, y + bird.height / 2);
            let rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.001));
            ctx.rotate(rot);
            skinManager.drawBirdGraphic(ctx, 0, 0, 1.1, skinManager.currentIndex, bird.wingAngle);
            ctx.restore();
        }

        function drawCustomLoadingLogo(centerX, centerY) {
            ctx.save();
            ctx.translate(centerX, centerY);

            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.arc(0, 10, 40, 0, Math.PI * 2);
            ctx.fill();

            let bodyGrad = ctx.createRadialGradient(-5, -5, 5, 0, 0, 32);
            bodyGrad.addColorStop(0, "#ffeb3b");
            bodyGrad.addColorStop(0.7, "#ff9800");
            bodyGrad.addColorStop(1, "#e65100");
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#b23c00";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = "#fff59d";
            ctx.beginPath();
            ctx.ellipse(-4, 6, 12, 8, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#e65100";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(10, -8, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#333333";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(13, -8, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(14.5, -9.5, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ff5722";
            ctx.beginPath();
            ctx.moveTo(20, -2);
            ctx.lineTo(34, 1);
            ctx.lineTo(20, 8);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#b23c00";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function draw(dt) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (window.gameState === "LOADING") {
                drawActiveBackground(dt);
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawCustomLoadingLogo(canvas.width / 2, canvas.height / 2 - 50);

                ctx.fillStyle = "#ffd166"; 
                ctx.font = "bold 26px 'Segoe UI', sans-serif"; 
                ctx.textAlign = "center";
                ctx.shadowColor = "#000"; ctx.shadowBlur = 8;
                ctx.fillText("FLAPPY BIRD", canvas.width / 2, canvas.height / 2 + 35);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#b7e4c7"; 
                ctx.font = "bold 14px 'Segoe UI', sans-serif"; 
                ctx.textAlign = "center";
                let dotsCount = Math.floor(idleAnimCounter * 1.5) % 4;
                let dots = ".".repeat(dotsCount);
                ctx.fillText("Loading" + dots, canvas.width / 2, canvas.height - 110);

                ctx.textAlign = "left";
                return;
            }

            if (window.gameState === "LOGIN") {
                drawActiveBackground(dt);
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 21px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                ctx.fillText("FLAPPY CLOUD SYNC", canvas.width / 2, 140);
                ctx.font = "12px 'Segoe UI', sans-serif"; ctx.fillStyle = "#b7e4c7";
                ctx.fillText("Sign in with Google to sync your score", canvas.width / 2, 170);

                let btnX = 40, btnY = 310, btnW = 280, btnH = 55;
                ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 8); ctx.fill();
                ctx.strokeStyle = "#52b788"; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = "#4285F4"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "left";
                ctx.fillText("G", btnX + 25, btnY + 33);
                ctx.fillStyle = "#333333"; ctx.font = "bold 13px sans-serif";
                ctx.fillText("Sign in with Google (Gmail)", btnX + 55, btnY + 32);
                ctx.textAlign = "left";

            } else if (window.gameState === "PROFILE_SETUP") {
                drawActiveBackground(dt);
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 19px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                ctx.fillText("SETUP PROFILE", canvas.width / 2, 60);
                ctx.fillStyle = "#b7e4c7"; ctx.font = "11px 'Segoe UI', sans-serif";
                ctx.fillText("Email: " + (window.userEmail || ""), canvas.width / 2, 85);

                let uBoxX = 50, uBoxY = 210, uBoxW = 260, uBoxH = 45;
                ctx.fillStyle = inputActiveField === "username" ? "#1f4e38" : "#133121";
                ctx.beginPath(); ctx.roundRect(uBoxX, uBoxY, uBoxW, uBoxH, 8); ctx.fill();
                ctx.strokeStyle = inputActiveField === "username" ? "#9ef01a" : "#52b788"; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = "#88ab8e"; ctx.font = "11px 'Segoe UI', sans-serif"; ctx.textAlign = "left";
                ctx.fillText("Username (Unique):", uBoxX, uBoxY - 8);
                
                ctx.fillStyle = "#ffffff"; ctx.font = "14px 'Segoe UI', sans-serif";
                let displayUser = inputUsernameVal + (inputActiveField === "username" && Math.floor(idleAnimCounter * 10) % 2 === 0 ? "|" : "");
                ctx.fillText(displayUser, uBoxX + 15, uBoxY + 28);

                let cBoxX = 50, cBoxY = 300, cBoxW = 260, cBoxH = 45;
                ctx.fillStyle = inputActiveField === "country" ? "#1f4e38" : "#133121";
                ctx.beginPath(); ctx.roundRect(cBoxX, cBoxY, cBoxW, cBoxH, 8); ctx.fill();
                ctx.strokeStyle = inputActiveField === "country" ? "#9ef01a" : "#52b788"; ctx.stroke();

                ctx.fillStyle = "#88ab8e"; ctx.font = "11px 'Segoe UI', sans-serif";
                ctx.fillText("World Country (e.g. India, USA):", cBoxX, cBoxY - 8);
                
                ctx.fillStyle = "#ffffff"; ctx.font = "14px 'Segoe UI', sans-serif";
                let displayCountry = inputCountryVal + (inputActiveField === "country" && Math.floor(idleAnimCounter * 10) % 2 === 0 ? "|" : "");
                ctx.fillText(displayCountry, cBoxX + 15, cBoxY + 28);

                if (setupErrorMsg) {
                    ctx.fillStyle = "#ff758f"; ctx.font = "bold 11px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                    ctx.fillText(setupErrorMsg, canvas.width / 2, 380);
                }

                drawWoodenButton("SUBMIT & START", 80, 420, 200, 50, "save_profile");
                ctx.textAlign = "left";

            } else if (window.gameState === "MENU") {
                drawActiveBackground(dt);

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 27px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                ctx.shadowColor = "#000"; ctx.shadowBlur = 6;
                ctx.fillText("FLAPPY BIRD", canvas.width / 2, 140);
                ctx.shadowBlur = 0;

                if (settingImg.complete && settingImg.naturalWidth !== 0) {
                    ctx.drawImage(settingImg, 17, 17, 26, 26);
                } else {
                    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(30, 30, 14, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.fillText("⚙", 30, 34);
                }

                drawWoodenButton("PLAY GAME", 80, 250, 200, 55, "play");
                drawWoodenButton("STORE / SKINS", 80, 320, 200, 55, "store");
                drawWoodenButton("LEADERBOARD", 80, 390, 200, 55, "leaderboard");

            } else if (window.gameState === "SETTINGS") {
                ctx.fillStyle = "#1b4332"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawWoodenButton("<- BACK", 15, 14, 75, 32, "back");

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 21px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                ctx.fillText("SETTINGS", canvas.width / 2, 60);

                let boxX = 25, boxY = 85, boxW = 310, boxH = 390;
                ctx.fillStyle = "#133121"; ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 12); ctx.fill();
                ctx.strokeStyle = "#52b788"; ctx.lineWidth = 2.5; ctx.stroke();

                ctx.fillStyle = "#b7e4c7"; ctx.font = "bold 11px 'Segoe UI', sans-serif"; ctx.textAlign = "left";
                ctx.fillText("GMAIL CLOUD PROFILE", boxX + 15, boxY + 24);

                let displayEmail = window.userEmail || "Not Logged In";
                let displayUser = window.username || "Player";
                let displayCountry = window.userCountry || "N/A";

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 11px 'Segoe UI', sans-serif";
                ctx.fillText("✉ " + displayEmail, boxX + 15, boxY + 44);
                ctx.fillText("👤 " + displayUser + " (" + displayCountry + ")", boxX + 15, boxY + 62);

                ctx.strokeStyle = "#2d6a4f"; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(boxX + 15, boxY + 74); ctx.lineTo(boxX + boxW - 15, boxY + 74); ctx.stroke();

                function drawSettingRow(label, status, yPos) {
                    ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px 'Segoe UI', sans-serif"; ctx.textAlign = "left";
                    ctx.fillText(label, boxX + 15, yPos);

                    let btnColor = status ? "#2d6a4f" : "#6f1d1b";
                    let txtColor = status ? "#9ef01a" : "#ff758f";
                    let txt = status ? "ON" : "OFF";

                    ctx.fillStyle = btnColor; ctx.beginPath(); ctx.roundRect(boxX + 195, yPos - 18, 65, 26, 6); ctx.fill();
                    ctx.strokeStyle = txtColor; ctx.lineWidth = 1.5; ctx.stroke();

                    ctx.fillStyle = txtColor; ctx.textAlign = "center"; ctx.font = "bold 11px 'Segoe UI', sans-serif";
                    ctx.fillText(txt, boxX + 227.5, yPos - 1);
                }

                drawSettingRow("Background Music", settings.music, boxY + 115);
                drawSettingRow("Sound Effects", settings.sound, boxY + 175);

                drawWoodenButton("LOGOUT / SWITCH ACCOUNT", boxX + 20, boxY + 310, boxW - 40, 40, "logout");

                ctx.textAlign = "left";

            } else if (window.gameState === "LEADERBOARD") {
                ctx.fillStyle = "#1b4332"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawWoodenButton("<- BACK", 15, 14, 75, 32, "back");

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 21px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                ctx.fillText("LEADERBOARD", canvas.width / 2, 55);

                let boxX = 15, boxY = 75, boxW = 330, boxH = 430;
                ctx.fillStyle = "#133121"; ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 12); ctx.fill();
                ctx.strokeStyle = "#52b788"; ctx.lineWidth = 2.5; ctx.stroke();

                if (window.isLeaderboardLoading) {
                    ctx.fillStyle = "#ffcc00"; ctx.font = "bold 14px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                    ctx.fillText("Loading Standings...", canvas.width / 2, boxY + 215);
                } else if (!window.leaderboardData || window.leaderboardData.length === 0) {
                    ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                    ctx.fillText("No Players Registered Yet!", canvas.width / 2, boxY + 215);
                } else {
                    ctx.fillStyle = "#ffcc00"; ctx.font = "bold 11px 'Segoe UI', sans-serif"; ctx.textAlign = "left";
                    ctx.fillText("RANK", boxX + 12, boxY + 28);
                    ctx.fillText("PLAYER", boxX + 55, boxY + 28);
                    ctx.fillText("COUNTRY", boxX + 190, boxY + 28);
                    ctx.fillText("SCORE", boxX + 270, boxY + 28);

                    ctx.strokeStyle = "#2d6a4f"; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(boxX + 10, boxY + 38); ctx.lineTo(boxX + boxW - 10, boxY + 38); ctx.stroke();

                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(boxX + 5, boxY + 42, boxW - 10, boxH - 50);
                    ctx.clip();

                    let rowY = boxY + 65 - leaderboardScrollOffset;
                    for (let i = 0; i < window.leaderboardData.length; i++) {
                        let item = window.leaderboardData[i];
                        let isMe = (item.email && item.email === window.userEmail);

                        if (rowY >= boxY + 35 && rowY <= boxY + boxH) {
                            if (isMe) {
                                ctx.fillStyle = "#2d6a4f"; ctx.fillRect(boxX + 10, rowY - 16, boxW - 20, 26);
                            }

                            ctx.fillStyle = isMe ? "#9ef01a" : "#ffffff";
                            ctx.font = (isMe ? "bold " : "") + "11px 'Segoe UI', sans-serif";
                            ctx.textAlign = "left";

                            ctx.fillText("#" + (i + 1), boxX + 12, rowY);
                            let truncUser = item.username.length > 10 ? item.username.substring(0, 9) + ".." : item.username;
                            ctx.fillText(truncUser, boxX + 55, rowY);
                            let truncCountry = item.country.length > 8 ? item.country.substring(0, 7) + ".." : item.country;
                            ctx.fillText(truncCountry, boxX + 190, rowY);
                            ctx.fillText(item.highScore, boxX + 270, rowY);
                        }

                        rowY += 30;
                    }
                    ctx.restore();
                }
                ctx.textAlign = "left";

            } else if (window.gameState === "STORE") {
                ctx.fillStyle = "#1b4332"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                drawWoodenButton("<- BACK", 12, 14, 65, 30, "back");
                drawWoodenButton("BIRDS", 82, 14, 68, 30, "tab_birds");
                drawWoodenButton("BACKGROUNDS", 155, 14, 105, 30, "tab_bgs");

                let storeCoinX = 272;
                if (coinImg.complete && coinImg.naturalWidth !== 0) ctx.drawImage(coinImg, storeCoinX, 19, 16, 16);
                ctx.fillStyle = "#ffcc00"; ctx.font = "bold 12px 'Segoe UI', sans-serif"; ctx.textAlign = "left";
                ctx.fillText(window.coins, storeCoinX + 18, 32);

                let itemsList = storeTab === "BIRD" ? skinManager.skins : skinManager.backgrounds;
                let activeIdx = storeTab === "BIRD" ? skinManager.currentIndex : skinManager.bgIndex;

                for (let i = 0; i < itemsList.length; i++) {
                    let col = i % 3;
                    let row = Math.floor(i / 3);
                    let boxX = 20 + col * 108;
                    let boxY = 65 + row * 82;
                    let item = itemsList[i];

                    ctx.fillStyle = activeIdx === i ? "#2d6a4f" : "#133121";
                    ctx.beginPath(); ctx.roundRect(boxX, boxY, 102, 76, 8); ctx.fill();
                    ctx.strokeStyle = activeIdx === i ? "#9ef01a" : "#40916c"; ctx.lineWidth = activeIdx === i ? 2.5 : 1.5; ctx.stroke();

                    if (storeTab === "BIRD") {
                        skinManager.drawBirdGraphic(ctx, boxX + 51, boxY + 26, 0.65, i);
                    } else {
                        ctx.fillStyle = item.top; ctx.fillRect(boxX + 6, boxY + 6, 90, 30);
                        ctx.fillStyle = item.mountain; ctx.beginPath();
                        ctx.moveTo(boxX + 6, boxY + 36); ctx.lineTo(boxX + 30, boxY + 16); ctx.lineTo(boxX + 60, boxY + 36);
                        ctx.closePath(); ctx.fill();
                    }

                    ctx.fillStyle = "#fff"; ctx.font = "8px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                    ctx.fillText(item.name, boxX + 51, boxY + 50);

                    if (item.unlocked) {
                        ctx.fillStyle = activeIdx === i ? "#9ef01a" : "#b7e4c7"; ctx.font = "bold 8px 'Segoe UI', sans-serif";
                        ctx.fillText(activeIdx === i ? "[EQUIPPED]" : "OWNED", boxX + 51, boxY + 66);
                    } else {
                        let priceX = boxX + 25;
                        if (coinImg.complete && coinImg.naturalWidth !== 0) ctx.drawImage(coinImg, priceX, boxY + 57, 10, 10);
                        ctx.fillStyle = "#ffcc00"; ctx.font = "bold 10px 'Segoe UI', sans-serif"; ctx.textAlign = "left";
                        ctx.fillText(item.price, priceX + 13, boxY + 66);
                    }
                    ctx.textAlign = "left";
                }

            } else {
                drawActiveBackground(dt);

                pipes.forEach(p => { drawPipe(p.x, p.top, p.bottom); });
                drawInGameBird(bird.x, bird.y);

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 25px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                ctx.fillText(score, canvas.width / 2, 50);

                if (coinImg.complete && coinImg.naturalWidth !== 0) ctx.drawImage(coinImg, 16, 16, 22, 22);
                ctx.fillStyle = "#ffcc00"; ctx.font = "bold 15px 'Segoe UI', sans-serif"; ctx.textAlign = "left";
                ctx.fillText(window.coins, 42, 33);

                if (window.gameState === "GAMEOVER") {
                    ctx.fillStyle = "rgba(0, 0, 0, 0.65)"; ctx.fillRect(0, 0, canvas.width, canvas.html);

                    let pX = 70, pY = 160, pW = 220, pH = 260;
                    ctx.fillStyle = "#1b4332"; ctx.beginPath(); ctx.roundRect(pX, pY, pW, pH, 15); ctx.fill();
                    ctx.strokeStyle = "#52b788"; ctx.lineWidth = 3; ctx.stroke();

                    ctx.fillStyle = "#ff007f"; ctx.font = "bold 21px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
                    ctx.fillText("GAME OVER", canvas.width / 2, pY + 40);

                    ctx.fillStyle = "#ffffff"; ctx.font = "13px 'Segoe UI', sans-serif";
                    ctx.fillText("Score: " + score, canvas.width / 2, pY + 80);
                    ctx.fillText("Best: " + window.highScore, canvas.width / 2, pY + 110);

                    drawWoodenButton("PLAY AGAIN", 90, pY + 140, 180, 40, "retry");
                    drawWoodenButton("MAIN MENU", 90, pY + 195, 180, 40, "popup_menu");
                    ctx.textAlign = "left";
                }
            }
        }

        let lastTime = performance.now();
        function gameLoop(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            if (dt > 0.1) dt = 0.1;
            update(dt);
            draw(dt);
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
